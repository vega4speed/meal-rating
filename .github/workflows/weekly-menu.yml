name: Weekly menu import

on:
  schedule:
    # The new Clean Eatz menu goes live Tuesday 8:00am US Eastern (their local
    # clock, which follows DST). GitHub cron is UTC and does NOT follow DST, so a
    # fixed UTC time drifts an hour twice a year. These three cover both seasons:
    #   12:01 UTC = 8:01 EDT / 7:01 EST   (on-time in summer)
    #   13:01 UTC = 9:01 EDT / 8:01 EST   (fallback summer, on-time winter)
    #   14:01 UTC = 10:01 EDT / 9:01 EST  (fallback winter)
    # Whichever run fires before the menu is live just soft-exits; the import is
    # idempotent, so the extra run each week costs nothing.
    - cron: '1 12 * * 2'
    - cron: '1 13 * * 2'
    - cron: '1 14 * * 2'
  workflow_dispatch:
  # Editing the importer runs it once so changes get tested.
  push:
    paths:
      - scripts/weekly-menu-import.mjs
      - .github/workflows/weekly-menu.yml

# Don't let two runs write at once.
concurrency:
  group: weekly-menu
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/weekly-menu-import.mjs
        env:
          CE_IMPORT_TOKEN: ${{ secrets.CE_IMPORT_TOKEN }}
          SUPABASE_URL: https://udvyspzljnxjuizbxucp.supabase.co
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
