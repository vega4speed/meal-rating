name: Weekly menu import

on:
  schedule:
    # Tuesday mornings, ~3am & ~6am US Central. Cron is UTC with no DST, so:
    # 08:00 UTC = 3am CDT / 2am CST; 11:00 UTC = 6am CDT / 5am CST.
    - cron: '0 8 * * 2'
    - cron: '0 11 * * 2'
  workflow_dispatch:
  # Editing the importer runs it once so changes get tested.
  push:
    paths:
      - scripts/weekly-menu-import.mjs
      - .github/workflows/weekly-menu.yml

# Don't let two runs write at once.
concurrency:
  group: weekly-menu
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/weekly-menu-import.mjs
        env:
          CE_IMPORT_TOKEN: ${{ secrets.CE_IMPORT_TOKEN }}
          SUPABASE_URL: https://udvyspzljnxjuizbxucp.supabase.co
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
