name: Weekly menu import

on:
  schedule:
    # The new Clean Eatz menu goes live Tuesday 8am US Eastern. Run just after,
    # with a fallback an hour later. Cron is UTC with no DST:
    #   12:01 UTC = 8:01 EDT (7:01 EST);  13:01 UTC = 9:01 EDT (8:01 EST).
    # In EST (~Nov–Mar) both shift an hour earlier; the 13:01 run still lands
    # right at the 8am EST drop. Add a '1 14 * * 2' slot if winter misses.
    - cron: '1 12 * * 2'
    - cron: '1 13 * * 2'
  workflow_dispatch:
  # Editing the importer runs it once so changes get tested.
  push:
    paths:
      - scripts/weekly-menu-import.mjs
      - .github/workflows/weekly-menu.yml

# Don't let two runs write at once.
concurrency:
  group: weekly-menu
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/weekly-menu-import.mjs
        env:
          CE_IMPORT_TOKEN: ${{ secrets.CE_IMPORT_TOKEN }}
          SUPABASE_URL: https://udvyspzljnxjuizbxucp.supabase.co
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
